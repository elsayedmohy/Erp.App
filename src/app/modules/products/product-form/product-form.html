@let s = state;

<div class="page">
  <app-page-header
    [heading]="s.isEdit() ? 'Edit product' : 'New product'"
    [breadcrumbs]="[
      { label: 'Inventory' },
      { label: 'Products', link: '/products' },
      { label: s.isEdit() ?  'Edit' : 'New' },
    ]"
  >
    @if (s.isEdit()) {
      <a
        tuiButton
        appearance="secondary"
        size="m"
        iconStart="@tui.package-plus"
        routerLink="../stock"
        >Adjust stock</a
      >
    }
  </app-page-header>
  @if (s.loadError()) {
    <app-error-state heading="Couldn't load product" [message]="s.loadError()!" [retryable]="false">
      <a tuiButton size="s" appearance="secondary" routerLink="/products">Back to products</a>
    </app-error-state>
  } @else if (s.loading()) {
    <page-loader />
  } @else {
    <form class="grid-3" tuiCardLarge appearance="outline-grayscale" tuiForm="m" [formGroup]="form" (ngSubmit)="s.submit()">
      @if (s.formError()) {
        <div tuiNotification appearance="negative" size="m">{{ s.formError() }}</div>
      }

      <div class="grid-2">
        @for (f of fields; track f.key) {
          <div class="field" >
            <tui-textfield>
              <label tuiLabel>{{ f.label }}</label>
              <input tuiInput [formControlName]="f.key" [type]="f.type ?? 'text'"
                     [placeholder]="f.placeholder" />
            </tui-textfield>

<!--            <app-field-error [control]="form.controls[f.key]" />-->
          </div>
        }
        <tui-textfield tuiChevron
                       tuiTextfieldSize="m"
                       [stringify]="stringify">
          <input
            tuiSelect
            placeholder="All categories"
            formControlName="categoryId"
          />


          <tui-data-list *tuiDropdown>
            @for (item of categories(); track item) {
              <button
                tuiOption
                type="button"
                [value]="item.id"
              >
                {{ item.name }}
              </button>
            }
          </tui-data-list>
        </tui-textfield>
      </div>

      <footer>
        <a tuiButton appearance="secondary" size="m"
           [routerLink]="s.isEdit() ? ['/products', id()] : '/products'">Cancel</a>
        <button tuiButton size="m" type="submit" [disabled]="s.saving()">
          {{ s.saving() ? 'Saving…' : s.isEdit() ? 'Update' : 'Save' }}
        </button>
      </footer>
    </form>
  }
