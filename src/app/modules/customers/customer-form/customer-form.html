@let s = state;
<div class="page">
  <app-page-header
    [heading]="s.isEdit() ? 'Edit customer' : 'New customer'"
    [breadcrumbs]="[
      { label: 'Sales' },
      { label: 'Customers', link: '/customers' },
      { label: s.isEdit() ? 'Edit' : 'New' },
    ]"
  />


  @if (s.loadError()) {
    <app-error-state heading="Couldn't load customer" [message]="s.loadError()!" [retryable]="false">
      <a tuiButton size="s" appearance="secondary" routerLink="/customers">Back to customers</a>
    </app-error-state>
  } @else if (s.loading()) {
    <page-loader />
  } @else {
    <form tuiCardLarge appearance="outline-grayscale" tuiForm="m" [formGroup]="form" (ngSubmit)="s.submit()">
      @if (s.formError()) {
        <div tuiNotification appearance="negative" size="m">{{ s.formError() }}</div>
      }

      <div class="grid-2">
        @for (f of fields; track f.key) {
          <div class="field" [class.field_wide]="f.wide">
            <tui-textfield>
              <label tuiLabel>{{ f.label }}</label>
              <input tuiInput [formControlName]="f.key" [type]="f.type ?? 'text'"
                     [placeholder]="f.placeholder" [attr.maxlength]="f.max" />
            </tui-textfield>
            <app-field-error [control]="form.controls[f.key]" />
          </div>
        }
      </div>

      <footer>
        <a tuiButton appearance="secondary" size="m"
           [routerLink]="s.isEdit() ? ['/customers', id()] : '/customers'">Cancel</a>
        <button tuiButton size="m" type="submit" [disabled]="s.saving()">
          {{ s.saving() ? 'Saving…' : s.isEdit() ? 'Update' : 'Save' }}
        </button>
      </footer>
    </form>
  }
</div>
