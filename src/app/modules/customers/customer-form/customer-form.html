<div class="page">
  <app-page-header
    [heading]="mode() === 'edit' ? 'Edit customer' : 'New customer'"
    [breadcrumbs]="[
      { label: 'Sales' },
      { label: 'Customers', link: '/customers' },
      { label: mode() === 'edit' ? 'Edit' : 'New' },
    ]"
  />

  <form tuiCardLarge appearance="outline-grayscale" tuiForm="m" [formGroup]="form">
    <div class="grid-2">
      <tui-textfield>
        <label tuiLabel>Name</label>
        <input tuiInput formControlName="name" placeholder="Acme Corp" />
      </tui-textfield>
      <tui-textfield>
        <label tuiLabel>Email</label>
        <input tuiInput formControlName="email" type="email" placeholder="info@acme.com" />
      </tui-textfield>
      <tui-textfield>
        <label tuiLabel>Phone</label>
        <input tuiInput formControlName="phone" type="tel" placeholder="+1-555-000-1234" />
      </tui-textfield>
      <tui-textfield>
        <label tuiLabel>Tax ID</label>
        <input tuiInput formControlName="taxId" placeholder="US123456789" />
      </tui-textfield>
    </div>
    <tui-textfield>
      <label tuiLabel>Address</label>
      <input tuiInput formControlName="address" placeholder="123 Main St" />
    </tui-textfield>
    <div class="grid-2">
      <tui-textfield>
        <label tuiLabel>City</label>
        <input tuiInput formControlName="city" placeholder="New York" />
      </tui-textfield>
      <tui-textfield>
        <label tuiLabel>Country</label>
        <input tuiInput formControlName="country" placeholder="USA" />
      </tui-textfield>
    </div>
    <footer>
      <a tuiButton appearance="secondary" size="m" routerLink="/customers">Cancel</a>
      <button tuiButton size="m" type="button">{{ mode() === 'edit' ? 'Update' : 'Save' }}</button>
    </footer>
  </form>
</div>
