<div class="page">
  <app-page-header
    [heading]="isEdit() ? 'Edit customer' : 'New customer'"
    [breadcrumbs]="[
      { label: 'Sales' },
      { label: 'Customers', link: '/customers' },
      { label: isEdit() ? 'Edit' : 'New' },
    ]"
  />

  @if (loadError()) {
    <app-error-state heading="Couldn't load customer" [message]="loadError()!" [retryable]="false">
      <a tuiButton size="s" appearance="secondary" routerLink="/customers">Back to customers</a>
    </app-error-state>

  } @else if (loading()) {
    <page-loader />

  } @else {
    <form tuiCardLarge appearance="outline-grayscale" tuiForm="m" [formGroup]="form" (ngSubmit)="submit()">
      @if (formError()) {
        <div tuiNotification appearance="negative" size="m">{{ formError() }}</div>
      }

      <div class="grid-2">
        @for (f of fields; track f.key) {
          <div class="field" [class.field_wide]="f.wide">
            <tui-textfield>
              <label tuiLabel>{{ f.label }}</label>
              <input
                tuiInput
                [formControlName]="f.key"
                [type]="f.type ?? 'text'"
                [placeholder]="f.placeholder"
                [attr.maxlength]="f.max"
              />
            </tui-textfield>
            <tui-error [error]="errorFor(f.key)" />
          </div>
        }
      </div>

      <footer>
        <a tuiButton appearance="secondary" size="m" [routerLink]="isEdit() ? ['/customers', id()] : '/customers'">
          Cancel
        </a>
        <button tuiButton size="m" type="submit" [disabled]="saving()">
          {{ saving() ? 'Saving…' : isEdit() ? 'Update' : 'Save' }}
        </button>
      </footer>
    </form>
  }
</div>
